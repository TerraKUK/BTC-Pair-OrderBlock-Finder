name: Check Order Block Prices

on:
  schedule:
    - cron: "*/15 * * * *"  # Runs every 15 minutes
  workflow_dispatch:        # Allows manual trigger

permissions:
  contents: write

jobs:
  price-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas python-telegram-bot

      - name: Check Order Block Prices
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/check_order_block_price.py

      - name: Commit sent alerts and last prices
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sent_alerts.txt data/last_prices.json || echo "No files"
          git commit -m "Update sent alerts and last prices" || echo "No changes to commit"
          git push || echo "Nothing to push"
        continue-on-error: true
